<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>곱셈 친구들 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Jua', 'Gaegu', sans-serif;
    background: linear-gradient(180deg, #FFE5F1 0%, #FFF4D6 50%, #D6F0FF 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
    user-select: none;
  }

  /* Floating background bubbles */
  .bg-bubble {
    position: fixed;
    border-radius: 50%;
    opacity: 0.4;
    pointer-events: none;
    animation: float 8s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-30px) rotate(180deg); }
  }

  .game {
    width: 100%;
    max-width: 440px;
    background: white;
    border-radius: 32px;
    padding: 20px;
    box-shadow: 0 12px 40px rgba(255, 150, 200, 0.3);
    position: relative;
    overflow: hidden;
  }

  /* Top bar */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 8px;
  }
  .stat {
    display: flex;
    align-items: center;
    gap: 6px;
    background: #FFF4D6;
    border: 3px solid #FFD66B;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 18px;
    color: #8B5A00;
    font-weight: 700;
  }
  .stat.time {
    background: #D6F0FF;
    border-color: #6BC5FF;
    color: #003D6B;
  }
  .stat.time.warn {
    background: #FFD6D6;
    border-color: #FF8888;
    color: #8B0000;
    animation: shake 0.4s infinite;
  }
  .stat .icon { font-size: 20px; }

  /* Mascot + target card */
  .target-area {
    background: linear-gradient(135deg, #FFE5F1 0%, #FFCCE5 100%);
    border: 4px solid #FF99CC;
    border-radius: 24px;
    padding: 16px 12px;
    position: relative;
    margin-bottom: 12px;
    text-align: center;
  }
  .mascot {
    position: absolute;
    top: -22px;
    right: -8px;
    font-size: 56px;
    transform: rotate(15deg);
    animation: bounce 2s ease-in-out infinite;
    transition: transform 0.3s;
  }
  @keyframes bounce {
    0%, 100% { transform: rotate(15deg) translateY(0); }
    50% { transform: rotate(15deg) translateY(-8px); }
  }
  .mascot.happy { animation: spin-happy 0.6s ease; }
  @keyframes spin-happy {
    0% { transform: rotate(15deg) scale(1); }
    50% { transform: rotate(375deg) scale(1.4); }
    100% { transform: rotate(15deg) scale(1); }
  }
  .mascot.sad {
    animation: shake-sad 0.5s ease;
  }
  @keyframes shake-sad {
    0%, 100% { transform: rotate(15deg); }
    25% { transform: rotate(0deg); }
    75% { transform: rotate(30deg); }
  }

  .target-label {
    font-size: 16px;
    color: #C2185B;
    margin-bottom: 4px;
  }
  .target-number {
    font-size: 80px;
    color: #AD1457;
    line-height: 1;
    margin: 4px 0 8px;
    text-shadow: 3px 3px 0 #FFCCE5;
    animation: number-pop 0.5s ease;
  }
  @keyframes number-pop {
    0% { transform: scale(0.3) rotate(-20deg); opacity: 0; }
    60% { transform: scale(1.2) rotate(5deg); }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }
  .progress-dots {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-top: 4px;
  }
  .dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: white;
    border: 2px solid #FF99CC;
    transition: all 0.3s;
  }
  .dot.filled {
    background: #FFD700;
    border-color: #FFA500;
    transform: scale(1.2);
    box-shadow: 0 0 8px #FFD700;
  }

  /* Found chips zone */
  .found-zone {
    min-height: 70px;
    background: #F4FFE5;
    border: 3px dashed #B8E060;
    border-radius: 20px;
    padding: 12px;
    margin-bottom: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    align-items: center;
  }
  .found-empty {
    font-size: 18px;
    color: #6B9D2E;
  }
  .found-chip {
    background: white;
    border: 3px solid #97C459;
    color: #3B6D11;
    font-size: 28px;
    padding: 8px 18px;
    border-radius: 999px;
    animation: chip-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    box-shadow: 0 3px 0 #97C459;
  }
  @keyframes chip-in {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* Input row */
  .input-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .slot {
    width: 72px;
    height: 72px;
    border: 4px dashed #B8D8FF;
    border-radius: 20px;
    background: #F0F8FF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    color: #2196F3;
    cursor: pointer;
    transition: all 0.2s;
    font-family: 'Jua', sans-serif;
  }
  .slot.active {
    border-style: solid;
    border-color: #2196F3;
    background: white;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(33, 150, 243, 0.4); }
    50% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(33, 150, 243, 0); }
  }
  .slot.filled {
    border-style: solid;
    border-color: #2196F3;
    background: white;
    color: #0D47A1;
  }
  .times {
    font-size: 40px;
    color: #FF6B9D;
    font-family: 'Jua', sans-serif;
    animation: wiggle 2s ease-in-out infinite;
  }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-10deg); }
    75% { transform: rotate(10deg); }
  }

  /* Feedback */
  .feedback {
    text-align: center;
    min-height: 26px;
    font-size: 18px;
    margin-bottom: 8px;
    color: #666;
    transition: all 0.2s;
  }
  .feedback.good { color: #2E7D32; }
  .feedback.bad { color: #C62828; animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    75% { transform: translateX(8px); }
  }

  /* Number keypad - colorful! */
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 8px;
  }
  .key {
    height: 58px;
    border: none;
    border-radius: 18px;
    font-family: 'Jua', sans-serif;
    font-size: 28px;
    cursor: pointer;
    transition: all 0.1s;
    color: white;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    position: relative;
  }
  .key:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }
  /* Rainbow keypad */
  .key[data-n="1"] { background: #FF6B9D; }
  .key[data-n="2"] { background: #FFA500; }
  .key[data-n="3"] { background: #FFD700; color: #8B5A00; }
  .key[data-n="4"] { background: #95E060; }
  .key[data-n="5"] { background: #5DCAA5; }
  .key[data-n="6"] { background: #6BC5FF; }
  .key[data-n="7"] { background: #9C88FF; }
  .key[data-n="8"] { background: #FF88C8; }
  .key[data-n="9"] { background: #FF8866; }

  .action-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .key-action {
    height: 50px;
    border: none;
    border-radius: 16px;
    font-family: 'Jua', sans-serif;
    font-size: 18px;
    cursor: pointer;
    transition: all 0.1s;
    color: white;
    box-shadow: 0 4px 0 rgba(0,0,0,0.15);
  }
  .key-action:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.15);
  }
  .key-clear { background: #B0BEC5; }
  .key-check { background: #4CAF50; font-size: 22px; }
  .key-skip { background: #FF7043; }

  /* Celebration overlay */
  .celebrate {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(255, 245, 250, 0.97);
    border-radius: 32px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    text-align: center;
    padding: 20px;
  }
  .celebrate.show {
    display: flex;
    animation: celebrate-in 0.5s ease;
  }
  @keyframes celebrate-in {
    0% { transform: scale(0); opacity: 0; }
    60% { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
  }
  .celebrate-emoji {
    font-size: 90px;
    animation: bounce-big 0.6s ease-in-out infinite;
  }
  @keyframes bounce-big {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
  }
  .celebrate-title {
    font-size: 36px;
    color: #C2185B;
    margin: 10px 0;
    text-shadow: 3px 3px 0 #FFCCE5;
  }
  .celebrate-sub {
    font-size: 22px;
    color: #AD1457;
  }
  .celebrate-bonus {
    font-size: 28px;
    color: #FF6B00;
    margin-top: 10px;
    background: #FFE0B2;
    padding: 6px 18px;
    border-radius: 999px;
    border: 3px solid #FFB74D;
  }

  .review-box {
    background: white;
    border: 3px solid #FFB6D9;
    border-radius: 20px;
    padding: 14px 16px;
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 10px;
    max-width: 90%;
  }
  .review-target {
    font-size: 36px;
    color: #AD1457;
    text-shadow: 2px 2px 0 #FFCCE5;
  }
  .review-equals {
    font-size: 28px;
    color: #FF6B9D;
  }
  .review-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
  }
  .review-item {
    font-size: 22px;
    color: #3B6D11;
    background: #F4FFE5;
    padding: 4px 12px;
    border-radius: 999px;
    border: 2px solid #97C459;
    animation: review-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }
  @keyframes review-in {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  /* Confetti */
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    pointer-events: none;
    z-index: 200;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }

  /* Slot feedback flash */
  .slot.flash-bad {
    animation: flash-red 0.4s;
  }
  @keyframes flash-red {
    0%, 100% { background: #F0F8FF; }
    50% { background: #FFB0B0; border-color: #FF4444; }
  }
  .slot.flash-good {
    animation: flash-green 0.4s;
  }
  @keyframes flash-green {
    0%, 100% { background: #F0F8FF; }
    50% { background: #B0FFB0; border-color: #44FF44; }
  }
</style>
</head>
<body>

<!-- Background floating bubbles -->
<div class="bg-bubble" style="width: 80px; height: 80px; background: #FFB6C1; top: 10%; left: 5%; animation-delay: 0s;"></div>
<div class="bg-bubble" style="width: 60px; height: 60px; background: #FFE4B5; top: 20%; right: 8%; animation-delay: 1s;"></div>
<div class="bg-bubble" style="width: 100px; height: 100px; background: #B0E0E6; bottom: 15%; left: 10%; animation-delay: 2s;"></div>
<div class="bg-bubble" style="width: 70px; height: 70px; background: #DDA0DD; bottom: 25%; right: 5%; animation-delay: 3s;"></div>

<div class="game">
  <div class="topbar">
    <div class="stat"><span class="icon">⭐</span><span id="score">0</span></div>
    <div class="stat time" id="timer-box"><span class="icon">⏰</span><span id="timer">30</span>초</div>
  </div>

  <div class="target-area">
    <div class="mascot" id="mascot">🦄</div>
    <div class="target-label">이 숫자를 만들어 봐!</div>
    <div class="target-number" id="target">12</div>
    <div class="progress-dots" id="dots"></div>
  </div>

  <div class="found-zone" id="found-zone">
    <span class="found-empty">✨ 찾은 식이 모이는 곳 ✨</span>
  </div>

  <div class="input-row">
    <div class="slot active" id="slot-a">?</div>
    <span class="times">×</span>
    <div class="slot" id="slot-b">?</div>
  </div>

  <div class="feedback" id="feedback">숫자를 눌러봐! 🌟</div>

  <div class="keypad">
    <button class="key" data-n="1">1</button>
    <button class="key" data-n="2">2</button>
    <button class="key" data-n="3">3</button>
    <button class="key" data-n="4">4</button>
    <button class="key" data-n="5">5</button>
    <button class="key" data-n="6">6</button>
    <button class="key" data-n="7">7</button>
    <button class="key" data-n="8">8</button>
    <button class="key" data-n="9">9</button>
  </div>

  <div class="action-row">
    <button class="key-action key-clear" id="clear-btn">지우기</button>
    <button class="key-action key-skip" id="skip-btn">패스</button>
  </div>

  <div class="celebrate" id="celebrate">
    <div class="celebrate-emoji" id="celebrate-emoji">🎉</div>
    <div class="celebrate-title" id="celebrate-title">완벽해!</div>
    <div class="celebrate-sub" id="celebrate-sub">모든 식을 다 찾았어!</div>
    <div class="review-box" id="review-box">
      <div class="review-target" id="review-target">12</div>
      <div class="review-equals">=</div>
      <div class="review-list" id="review-list"></div>
    </div>
    <div class="celebrate-bonus" id="celebrate-bonus">+15점!</div>
  </div>
</div>

<script>
  const TARGETS = [8,12,16,18,21,24,28,32,36,42,48,49,54,56,63,64,72,81];
  const TIME_PER_ROUND = 30;
  const MASCOTS = ['🦄','🐰','🐻','🐼','🦊','🐯','🐸','🐵','🦁','🐨','🐹','🐶'];
  const CELEBRATE_EMOJIS = ['🎉','🌟','✨','🏆','💖','🌈'];

  let state = {
    target: null,
    pairs: [],
    found: new Set(),
    a: null, b: null,
    activeSlot: 'a',
    score: 0,
    timer: TIME_PER_ROUND,
    interval: null,
    roundOver: false,
    audioCtx: null
  };

  const $ = id => document.getElementById(id);

  // Simple beep sounds using Web Audio API
  function beep(freq, duration, type='sine', volume=0.1) {
    try {
      if (!state.audioCtx) state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const ctx = state.audioCtx;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.value = volume;
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch(e) {}
  }
  function soundCorrect() {
    beep(523, 0.1, 'sine', 0.15);
    setTimeout(() => beep(784, 0.15, 'sine', 0.15), 100);
  }
  function soundWrong() {
    beep(200, 0.2, 'sawtooth', 0.08);
  }
  function soundComplete() {
    [523, 659, 784, 1047].forEach((f, i) => {
      setTimeout(() => beep(f, 0.2, 'sine', 0.15), i * 120);
    });
  }
  function soundTick() {
    beep(300, 0.05, 'square', 0.05);
  }

  function getAllPairs(n) {
    const pairs = [];
    for (let a = 1; a <= 9; a++)
      for (let b = 1; b <= 9; b++)
        if (a * b === n) pairs.push([a, b]);
    return pairs;
  }

  function pickTarget() {
    return TARGETS[Math.floor(Math.random() * TARGETS.length)];
  }

  function randomMascot() {
    return MASCOTS[Math.floor(Math.random() * MASCOTS.length)];
  }

  function newRound() {
    state.target = pickTarget();
    state.pairs = getAllPairs(state.target);
    state.found = new Set();
    state.a = null;
    state.b = null;
    state.activeSlot = 'a';
    state.timer = TIME_PER_ROUND;
    state.roundOver = false;

    $('target').style.animation = 'none';
    void $('target').offsetWidth;
    $('target').style.animation = '';
    $('target').textContent = state.target;
    $('mascot').textContent = randomMascot();

    // Build progress dots
    const dots = $('dots');
    dots.innerHTML = '';
    state.pairs.forEach(() => {
      const d = document.createElement('div');
      d.className = 'dot';
      dots.appendChild(d);
    });

    $('found-zone').innerHTML = '<span class="found-empty">✨ 찾은 식이 모이는 곳 ✨</span>';
    $('celebrate').classList.remove('show');
    setFeedback('숫자를 눌러봐! 🌟', '');
    updateSlots();
    startTimer();
  }

  function startTimer() {
    clearInterval(state.interval);
    updateTimer();
    state.interval = setInterval(() => {
      state.timer--;
      updateTimer();
      if (state.timer <= 5 && state.timer > 0) soundTick();
      if (state.timer <= 0) timeUp();
    }, 1000);
  }

  function updateTimer() {
    $('timer').textContent = state.timer;
    const box = $('timer-box');
    if (state.timer <= 5) box.classList.add('warn');
    else box.classList.remove('warn');
  }

  function timeUp() {
    clearInterval(state.interval);
    state.roundOver = true;
    soundWrong();
    $('mascot').className = 'mascot sad';
    setFeedback('시간 끝! 다음 문제 가자~ ⏰', 'bad');
    setTimeout(() => { $('mascot').className = 'mascot'; newRound(); }, 1800);
  }

  function setFeedback(msg, type) {
    const el = $('feedback');
    el.textContent = msg;
    el.className = 'feedback' + (type ? ' ' + type : '');
  }

  function updateSlots() {
    const sa = $('slot-a');
    const sb = $('slot-b');
    sa.textContent = state.a === null ? '?' : state.a;
    sb.textContent = state.b === null ? '?' : state.b;
    sa.classList.remove('active', 'filled');
    sb.classList.remove('active', 'filled');
    if (state.a !== null) sa.classList.add('filled');
    if (state.b !== null) sb.classList.add('filled');
    if (state.activeSlot === 'a' && state.a === null) sa.classList.add('active');
    if (state.activeSlot === 'b' && state.b === null) sb.classList.add('active');
  }

  function pressNumber(n) {
    if (state.roundOver) return;
    beep(440 + n * 40, 0.08, 'sine', 0.08);
    if (state.activeSlot === 'a') {
      state.a = n;
      state.activeSlot = 'b';
      updateSlots();
    } else {
      state.b = n;
      updateSlots();
      // 두 칸 다 채워지면 자동으로 확인!
      setTimeout(checkAnswer, 250);
    }
  }

  function clearInput() {
    state.a = null;
    state.b = null;
    state.activeSlot = 'a';
    updateSlots();
    setFeedback('다시 해봐! 💪', '');
  }

  function flashSlots(cls) {
    $('slot-a').classList.add(cls);
    $('slot-b').classList.add(cls);
    setTimeout(() => {
      $('slot-a').classList.remove(cls);
      $('slot-b').classList.remove(cls);
    }, 400);
  }

  function checkAnswer() {
    if (state.roundOver) return;
    if (state.a === null || state.b === null) {
      setFeedback('두 칸 다 채워줘! 🤗', 'bad');
      soundWrong();
      return;
    }
    const key = `${state.a}x${state.b}`;
    const product = state.a * state.b;

    if (product !== state.target) {
      setFeedback(`${state.a} × ${state.b} = ${product} 이야. 다시! 🌱`, 'bad');
      flashSlots('flash-bad');
      soundWrong();
      $('mascot').className = 'mascot sad';
      setTimeout(() => { $('mascot').className = 'mascot'; clearInput(); }, 900);
      return;
    }
    if (state.found.has(key)) {
      setFeedback('이미 찾은 식이야! 다른 식 찾아봐 🔍', 'bad');
      flashSlots('flash-bad');
      soundWrong();
      setTimeout(clearInput, 900);
      return;
    }

    // Correct!
    state.found.add(key);
    state.score += 2;
    $('score').textContent = state.score;
    flashSlots('flash-good');
    soundCorrect();
    $('mascot').className = 'mascot happy';
    setTimeout(() => $('mascot').className = 'mascot', 600);

    const zone = $('found-zone');
    const empty = zone.querySelector('.found-empty');
    if (empty) zone.innerHTML = '';
    const chip = document.createElement('span');
    chip.className = 'found-chip';
    chip.textContent = `${state.a} × ${state.b}`;
    zone.appendChild(chip);

    // Fill a dot
    const dots = $('dots').querySelectorAll('.dot');
    for (let d of dots) {
      if (!d.classList.contains('filled')) { d.classList.add('filled'); break; }
    }

    setFeedback(`정답! ${state.a} × ${state.b} ✨ +2점`, 'good');

    if (state.found.size === state.pairs.length) {
      clearInterval(state.interval);
      state.roundOver = true;
      const bonus = 10 + state.timer;
      state.score += bonus;
      $('score').textContent = state.score;
      setTimeout(() => showCelebrate(bonus), 400);
    } else {
      setTimeout(clearInput, 700);
    }
  }

  function showCelebrate(bonus) {
    soundComplete();
    $('celebrate-emoji').textContent = CELEBRATE_EMOJIS[Math.floor(Math.random() * CELEBRATE_EMOJIS.length)];
    $('celebrate-title').textContent = ['완벽해!', '대단해!', '굉장해!', '천재야!'][Math.floor(Math.random()*4)];
    $('celebrate-sub').textContent = '모든 식을 다 찾았어!';
    $('celebrate-bonus').textContent = `+${bonus}점!`;

    // 복습 목록 채우기
    $('review-target').textContent = state.target;
    const list = $('review-list');
    list.innerHTML = '';
    state.pairs.forEach(([a, b], i) => {
      const item = document.createElement('span');
      item.className = 'review-item';
      item.textContent = `${a}×${b}`;
      item.style.animationDelay = (0.3 + i * 0.15) + 's';
      list.appendChild(item);
    });

    $('celebrate').classList.add('show');
    fireConfetti();
    // 식이 많아질수록 시간 더 주기
    const reviewTime = 2800 + state.pairs.length * 200;
    setTimeout(() => newRound(), reviewTime);
  }

  function fireConfetti() {
    const colors = ['#FF6B9D','#FFD700','#95E060','#6BC5FF','#9C88FF','#FF8866'];
    for (let i = 0; i < 40; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
      c.style.animation = `confetti-fall ${1.5 + Math.random()}s linear`;
      c.style.animationDelay = Math.random() * 0.5 + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 3000);
    }
  }

  function skip() {
    if (state.roundOver) return;
    clearInterval(state.interval);
    state.roundOver = true;
    const missed = state.pairs
      .filter(([a,b]) => !state.found.has(`${a}x${b}`))
      .map(([a,b]) => `${a}×${b}`).join(', ');
    if (missed) setFeedback(`못 찾은 식: ${missed}`, '');
    else setFeedback('다음 문제로! 🚀', '');
    setTimeout(() => newRound(), 2200);
  }

  // Wire up
  document.querySelectorAll('.key[data-n]').forEach(btn => {
    btn.addEventListener('click', () => pressNumber(parseInt(btn.dataset.n)));
  });
  $('clear-btn').addEventListener('click', clearInput);
  $('skip-btn').addEventListener('click', skip);
  $('slot-a').addEventListener('click', () => {
    if (!state.roundOver) { state.activeSlot = 'a'; state.a = null; updateSlots(); }
  });
  $('slot-b').addEventListener('click', () => {
    if (!state.roundOver) { state.activeSlot = 'b'; state.b = null; updateSlots(); }
  });

  document.addEventListener('keydown', (e) => {
    if (e.key >= '1' && e.key <= '9') pressNumber(parseInt(e.key));
    else if (e.key === 'Backspace' || e.key === 'Delete') clearInput();
  });

  newRound();
</script>

</body>
</html>
